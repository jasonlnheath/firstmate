name: CI diagnostics probe

# Throwaway diagnostic lane for the ci-suite-green task: runs targeted probes
# against the hosted ubuntu-latest environment for the deterministic failures
# seen in the serial test lanes. Dispatched via pull_request on this branch
# only; removed before the fix ships.

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-diag-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  probe:
    name: Hosted VM probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install tasks-axi the lane way
        run: |
          set -eu
          export NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm-global"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          npm install -g tasks-axi >/dev/null 2>&1
          tasks-axi --version

      - name: Probe A - process-tree visibility diagnosis (backend-rex family)
        run: |
          set -u
          d=$(mktemp -d)
          mkdir -p "$d/tree"
          ln -sf "$(command -v sleep)" "$d/tree/claude"
          cat > "$d/tree/wrapper" <<'SH'
          #!/usr/bin/env bash
          "$1" "$2"
          exit $?
          SH
          chmod +x "$d/tree/wrapper"
          bash -c '"$1" "$2" "$3" & wait' root "$d/tree/wrapper" "$d/tree/claude" 120 >/dev/null 2>&1 &
          TREE_ROOT=$!
          sleep 1
          echo "TREE_ROOT=$TREE_ROOT alive=$([ -d /proc/$TREE_ROOT ] && echo yes || echo no)"
          if [ -d "/proc/$TREE_ROOT" ]; then
            echo "root cmdline: $(tr '\0' ' ' < "/proc/$TREE_ROOT/cmdline" 2>/dev/null)"
            for ch in $(pgrep -P "$TREE_ROOT" 2>/dev/null); do
              echo "  child $ch: $(tr '\0' ' ' < "/proc/$ch/cmdline" 2>/dev/null) state=$(awk '{print $3}' "/proc/$ch/stat" 2>/dev/null)"
              for gch in $(pgrep -P "$ch" 2>/dev/null); do
                echo "    grandchild $gch: $(tr '\0' ' ' < "/proc/$gch/cmdline" 2>/dev/null) state=$(awk '{print $3}' "/proc/$gch/stat" 2>/dev/null)"
              done
            done
          fi
          echo "--- ps -axo pid=,args= head:"
          ps -axo pid=,args= > /tmp/psout.txt 2>/tmp/pserr.txt; echo "ps rc=$?"
          head -4 /tmp/psout.txt; echo "(ps stderr: $(cat /tmp/pserr.txt))"
          echo "ps line count: $(wc -l < /tmp/psout.txt)"
          echo "--- tree lines in ps output:"; grep -c "tree" /tmp/psout.txt || echo 0
          # shellcheck disable=SC2009
          ps -e -o pid=,args= > /tmp/psout-e.txt 2>&1; echo "--- e option tree count: $(grep -c "tree" /tmp/psout-e.txt || echo 0)"
          echo "--- direct scan result:"
          ps -axo pid=,args= > /tmp/psout2.txt 2>&1
          awk -v p="$d/tree/claude" '$2 == p { print "MATCH", $1; exit }' /tmp/psout2.txt
          kill -KILL -- "-$TREE_ROOT" 2>/dev/null || true

      - name: Probe B - the real public-followup suite with tasks-axi present
        run: |
          set -u
          rc=0; bash tests/fm-public-followup.test.sh > /tmp/pf-suite.log 2>&1 || rc=$?
          echo "suite rc=$rc"
          echo "--- not ok lines:"; grep -E '^not ok' /tmp/pf-suite.log || echo "(none)"
          echo "--- wake-write test:"; grep -n "could not be written" /tmp/pf-suite.log || echo "(did not run)"
          echo "--- test count:"; grep -cE '^(ok|not ok)' /tmp/pf-suite.log || true
