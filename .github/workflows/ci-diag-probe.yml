name: CI diagnostics probe

# Throwaway diagnostic lane for the ci-suite-green task: runs targeted probes
# against the hosted ubuntu-latest environment for the deterministic failures
# seen in the serial test lanes. Dispatched via pull_request on this branch
# only; removed before the fix ships.

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-diag-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  probe:
    name: Hosted VM probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Probe A - isolate which parent-side construct reopens fd1
        run: |
          set -u
          echo "bash: $BASH_VERSION"
          mkdir -p /tmp/pa
          cat > /tmp/pa/p0.sh <<'SH'
          printf 'w\n' >&1
          SH
          cat > /tmp/pa/p1.sh <<'SH'
          [ 1 -ge 50 ] 2>/dev/null
          [ 1 -le 2000 ] 2>/dev/null
          [ 25 -ge 1 ] 2>/dev/null
          printf 'w\n' >&1
          SH
          cat > /tmp/pa/p2.sh <<'SH'
          printf 'sig\n' | cat >/dev/null
          printf 'w\n' >&1
          SH
          cat > /tmp/pa/p3.sh <<'SH'
          x=$(cat /etc/hostname 2>/dev/null)
          printf 'w\n' >&1
          SH
          cat > /tmp/pa/p4.sh <<'SH'
          printf '%s' 'a\nb\n' | LC_ALL=C sort | sha256sum >/dev/null
          printf 'w\n' >&1
          SH
          cat > /tmp/pa/p5.sh <<'SH'
          printf '%s\n' 'sig' | cat >/dev/null
          printf 'w\n' >&1
          SH
          for n in p0 p1 p2 p3 p4 p5; do
            rc=0
            bash /tmp/pa/$n.sh >&- 2>/tmp/pa/err.txt || rc=$?
            echo "$n rc=$rc stderr=[$(cat /tmp/pa/err.txt)]"
          done
      - name: Probe B - real poll with pending events + absent surfaced marker
        run: |
          set -u
          d=$(mktemp -d)
          home="$d/home"
          mkdir -p "$home/state/public-followup/events" \
            "$home/state/public-followup/rejection-wakes" \
            "$home/state/public-followup/registry" \
            "$home/fakebin" "$home/data" "$home/config"
          cat > "$home/fakebin/curl" <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x "$home/fakebin/curl"
          printf '{"id":"pf-probe","status":"report-ready"}\n' > "$home/state/public-followup/events/pf-probe.json"
          printf 'public-followup rejected pf-probe\n' > "$home/state/public-followup/rejection-wakes/pf-probe"
          PATH="$home/fakebin:$PATH" FM_ROOT_OVERRIDE="$PWD" FM_HOME="$home" \
            FM_STATE_OVERRIDE="$home/state" bin/fm-x-poll.sh >&- 2>"$d/err.txt" || true
          [ -e "$home/state/public-followup/rejection-wakes/pf-probe" ] \
            && echo "wake survived" || echo "WAKE VANISHED (repro)"
          echo "surfaced marker exists: $([ -e "$home/state/public-followup/surfaced" ] && echo yes || echo no)"
          echo "poll stderr: [$(cat "$d/err.txt")]"
