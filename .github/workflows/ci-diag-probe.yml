name: CI diagnostics probe

# Throwaway diagnostic lane for the ci-suite-green task: runs targeted probes
# against the hosted ubuntu-latest environment for the deterministic failures
# seen in the serial test lanes. Dispatched via pull_request on this branch
# only; removed before the fix ships.

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-diag-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  probe:
    name: Hosted VM probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Environment fingerprint
        run: |
          set -u
          echo "bash: $BASH_VERSION $(bash --version | head -1)"
          echo "timeout path: $(command -v timeout)"
          timeout --version | head -2 || true
          echo "coreutils dpkg:"; dpkg -l 2>/dev/null | grep -E 'coreutils|uutils' || true
          echo "gnu timeout candidates:"; ls -la /usr/bin/timeout /bin/timeout /usr/bin/timeout.gnu 2>/dev/null || true
          echo "ps: $(ps --version 2>&1 | head -1)"
          echo "node: $(node --version 2>&1)"
          echo "uname: $(uname -a)"

      - name: Probe 1 - closed-stdout write behavior (public-followup family)
        run: |
          set -u
          d=$(mktemp -d)
          # The exact firstmate shape: a script that writes its wake to fd 1
          # after opening state files, run with stdout closed, stderr kept.
          cat > "$d/poll.sh" <<'SH'
          #!/usr/bin/env bash
          set -u
          state=$(mktemp)
          printf 'x' > "$state"
          exec 9<"$state"
          read -r _ <"$state" || true
          printf 'wake-line\n' >&1 || { echo "write-to-fd1-failed rc=$?" >&2; exit 3; }
          echo "write-to-fd1-succeeded"
          SH
          chmod +x "$d/poll.sh"
          bash "$d/poll.sh" >&- 2>"$d/err.txt"; rc=$?
          echo "poll-fd1-closed rc=$rc"
          echo "stderr:"; cat "$d/err.txt"
          # Whether an earlier open() could silently claim fd 1 in bash 5.3.
          cat > "$d/reuse.sh" <<'SH'
          #!/usr/bin/env bash
          set -u
          exec 9>/tmp/probe-reuse-probe.txt
          printf 'wake-line\n' >&1 || { echo "write-failed" >&2; exit 3; }
          echo "write-succeeded"
          SH
          chmod +x "$d/reuse.sh"
          bash "$d/reuse.sh" >&- 2>"$d/err2.txt"; rc=$?
          echo "reuse rc=$rc"
          cat "$d/err2.txt"
          [ ! -e /tmp/probe-reuse-probe.txt ] || { echo "REUSE: fd1 was claimed:"; cat /tmp/probe-reuse-probe.txt; rm -f /tmp/probe-reuse-probe.txt; }

      - name: Probe 2 - uutils timeout signal semantics (watch-checkpoint family)
        run: |
          set -u
          # Shape 1: plain sleep under INT timeout - both implementations 124.
          set +e
          timeout --signal=INT 1s sleep 30; echo "sleep rc=$?"
          # Shape 2: a child that traps INT and cleans up for ~2s. GNU timeout
          # (no kill-after) waits and returns 124 once the child exits; a
          # reimplementation that escalates to KILL yields 137.
          timeout --signal=INT 1s bash -c 'trap "sleep 2; exit 0" INT; while :; do sleep 0.1; done'; echo "trapping-child rc=$?"
          # Shape 3: identify the implementation in use.
          if timeout --version 2>&1 | grep -qi 'GNU'; then
            echo "GNU timeout in use"
          else
            echo "uutils timeout in use"
          fi

      - name: Probe 3 - the exact quiet checkpoint on the hosted VM
        run: |
          set -u
          d=$(mktemp -d)
          home="$d/home"
          mkdir -p "$home/state" "$home/data" "$home/config"
          set +e
          env FM_HOME="$home" FM_POLL=1 FM_SIGNAL_GRACE=1 FM_CHECK_INTERVAL=999999 \
            bash bin/fm-watch-checkpoint.sh --seconds 1 >"$d/out.txt" 2>"$d/err.txt"
          rc=$?
          set -e
          echo "checkpoint rc=$rc (124 expected, 137 = the CI failure)"
          echo "--- out:"; cat "$d/out.txt"
          echo "--- err:"; cat "$d/err.txt"

      - name: Probe 4 - start_shell_tree ps scan (backend-rex family)
        run: |
          set -u
          d=$(mktemp -d)
          mkdir -p "$d/tree"
          ln -sf "$(command -v sleep)" "$d/tree/claude"
          cat > "$d/tree/wrapper" <<'SH'
          #!/usr/bin/env bash
          "$1" "$2"
          exit $?
          SH
          chmod +x "$d/tree/wrapper"
          bash -c '"$1" "$2" "$3" & wait' root "$d/tree/wrapper" "$d/tree/claude" 120 >/dev/null 2>&1 &
          TREE_ROOT=$!
          i=0; TREE_LEAF=
          while [ -z "$TREE_LEAF" ] && [ "$i" -lt 50 ]; do
            TREE_LEAF=$(ps -axo pid=,args= | awk -v p="$d/tree/claude" '$2 == p { print $1; exit }')
            [ -n "$TREE_LEAF" ] || sleep 0.1
            i=$((i + 1))
          done
          echo "TREE_LEAF=[$TREE_LEAF] after $i polls (nonempty expected)"
          echo "--- ps sample of tree processes:"
          # shellcheck disable=SC2009
          ps -axo pid=,args= | grep -F "$d/tree" || true
          echo "--- leaf identity (if found):"
          if [ -n "$TREE_LEAF" ]; then ps -o pid=,pgid=,comm=,args= -p "$TREE_LEAF"; fi
          echo "--- root identity:"
          ps -o pid=,pgid=,comm=,args= -p "$TREE_ROOT" || true
          echo "--- ps defaults:"
          ps -axo pid=,args= 2>&1 | head -3
          kill -KILL -- "-$TREE_ROOT" 2>/dev/null || true

      - name: Probe 5 - Pi package version resolved by latest
        run: |
          set -u
          npm install -g @earendil-works/pi-coding-agent >/dev/null 2>&1
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
